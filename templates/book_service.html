<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - {{ service.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #ff6f91;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        .booking-container {
            max-width: 600px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .btn {
            background-color: #ff6f91;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #ff4d6d;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #ff6f91;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Book Service: {{ service.name }}</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login_home_page') }}">Services</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main>
        <div class="booking-container">
            <h2>{{ service.name }}</h2>
            <p><strong>Description:</strong> {{ service.description }}</p>
            <p><strong>Price:</strong> ${{ service.price }}</p>

            <h3>Book this service:</h3>
            <form method="POST" action="{{ url_for('book_service', service_id=service.id) }}">
                <div class="form-group">
                    <label for="employee_id">Select Employee:</label>
                    <select name="employee_id" id="employee_id" required>
                        <option value="" disabled selected>Select an employee</option>
                        {% for employee in employees %}
                            <option value="{{ employee.id }}">{{ employee.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Select Booking Date:</label>
                    <input type="date" name="date" id="date" min="{{ min_date }}" required>
                </div>

                <button type="submit" class="btn">Confirm Booking</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Quickly Clean</p>
    </footer>
</body>
</html>
