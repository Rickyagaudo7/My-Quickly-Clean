<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Quickly Clean{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

  <style>
    /* Background wrapper and split slideshow */
    .background-wrapper {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
      user-select: none;
    }

    .background-left,
    .background-right {
      width: 50%;
      height: 100%;
      background-size: cover;
      background-position: center;
      animation-duration: 20s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;
    }

    .background-left {
      animation-name: slideLeft;
      background-image: url('{{ url_for("static", filename="theme1.png") }}');
    }

    .background-right {
      animation-name: slideRight;
      background-image: url('{{ url_for("static", filename="theme2.png") }}');
    }

    @keyframes slideLeft {
      0%, 50% {
        background-image: url('{{ url_for("static", filename="theme3.png") }}');
      }
      51%, 100% {
        background-image: url('{{ url_for("static", filename="theme4.png") }}');
      }
    }

    @keyframes slideRight {
      0%, 50% {
        background-image: url('{{ url_for("static", filename="theme1.png") }}');
      }
      51%, 100% {
        background-image: url('{{ url_for("static", filename="theme3.png") }}');
      }
    }

    /* Reset and base styles */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
      position: relative;
      z-index: 1;
    }

    /* Header styling */
    header {
      background-color: #ff5a71;
      padding: 1rem 2rem;
      color: white;
      box-shadow: 0 2px 8px rgba(255, 90, 113, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      position: relative;
    }

    header h1 {
      font-weight: 700;
      font-size: 1.5rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav ul li a {
      color: white;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #ffe0e6;
    }

    nav ul li a.btn.logout-btn {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
    }

    nav ul li a.btn.logout-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Main content */
    main {
      flex-grow: 1;
      padding: 2rem;
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Footer styling */
    footer {
      text-align: center;
      padding: 1rem 0;
      font-size: 0.9rem;
      color: #777;
      background: #fff;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
      position: relative;
      z-index: 10;
    }
  </style>

  {% block extra_styles %}{% endblock %}
</head>
<body>
  <!-- Background slideshow -->
  <div class="background-wrapper">
    <div class="background-left"></div>
    <div class="background-right"></div>
  </div>

  <!-- Header -->
  <header>
    <h1>Quickly Clean</h1>
    <nav>
      <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        {% if current_user.is_authenticated %}
          <li><a href="{{ url_for('logout') }}" class="btn logout-btn">Logout</a></li>
        {% else %}
          <li><a href="{{ url_for('register') }}">Register</a></li>
          <li><a href="{{ url_for('login') }}">Login</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Quickly Clean. All rights reserved.</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
