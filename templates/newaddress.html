<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickly Clean</title>

    <!-- Stripe.js Library -->
    <script src="https://js.stripe.com/v3/"></script>

    <!-- Link to your external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* Background image styling */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='background.png') }}") no-repeat center center fixed;
            background-size: cover;
            z-index: -1;
        }

        /* Header, Main Content, and Footer Styling */
        .header {
            background-color: #ff6f91;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .header nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
        }

        .header nav ul li {
            display: inline-block;
            margin: 0 2rem;
        }

        .header nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .header nav ul li a:hover {
            color: #ffe0e6;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #000;
        }

        .modal form input {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .modal form button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .modal form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <!-- Background Image -->
    <div class="background-image"></div>

    <!-- Header section -->
    <header class="header">
      
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">Home</a></li>
                {% if current_user.is_authenticated %}
                    <li><a href="{{ url_for('logout') }}" class="logout-button">Logout</a></li>
                {% else %}
                    <li><a href="{{ url_for('register') }}">Register</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            {% if current_user.is_authenticated %}
                <div class="welcome-section">
                    <div class="welcome-text">
                        Welcome back, {{ current_user.username }}!       
                    </div>
                    <div class="address-section">
                        <select id="address-select" class="address-dropdown">
                            <option value="1234 Example Street, City">1234 Example Street, City</option>
                        </select>
                        <button id="add-address-btn" class="add-address-btn">+ Add New Address</button>
                    </div>
                </div>
            {% endif %}
        </div>
    </main>

    <!-- Add Address Modal -->
    <div id="addAddressModal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h3>Add New Address</h3>
            <form id="add-address-form">
                <input type="text" id="street" placeholder="Street Address" required>
                <input type="text" id="city" placeholder="City" required>
                <input type="text" id="state" placeholder="State" required>
                <input type="text" id="zip" placeholder="ZIP Code" required>
                <button type="submit">Save Address</button>
            </form>
        </div>
    </div>

    <script>
        // Modal Elements
        const modal = document.getElementById('addAddressModal');
        const openModalButton = document.getElementById('add-address-btn');
        const closeModalButton = document.getElementById('close-modal');
        const addAddressForm = document.getElementById('add-address-form');

        // Open modal
        openModalButton.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        // Close modal
        closeModalButton.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Close modal when clicking outside the content
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Submit form
        addAddressForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const street = document.getElementById('street').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const zip = document.getElementById('zip').value;

            // Validate input
            if (!street || !city || !state || !zip) {
                alert('All fields are required.');
                return;
            }

            // Send address to server
            fetch('/add-address', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    street: street,
                    city: city,
                    state: state,
                    zip: zip,
                }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('Address added successfully!');
                        modal.style.display = 'none';
                        const addressSelect = document.getElementById('address-select');
                        const option = document.createElement('option');
                        option.value = `${street}, ${city}, ${state}, ${zip}`;
                        option.textContent = `${street}, ${city}, ${state}, ${zip}`;
                        addressSelect.appendChild(option);
                    } else {
                        alert(data.message || 'Error adding address.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred.');
                });
        });
    </script>
</body>
</html>
