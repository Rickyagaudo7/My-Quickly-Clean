{% extends "base.html" %}

{% block title %}Register - Quickly Clean{% endblock %}

{% block extra_styles %}
<style>
  /* ==========================================================================
     REGISTRATION-SPECIFIC STYLES
     ========================================================================== */
  .form-container {
    border-radius: 12px;
    padding: 3rem 3.5rem;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    box-shadow: none;
    text-align: left;
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    position: relative;
    z-index: 2;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    background: rgba(255, 255, 255, 0.15);
  }
  
  .form-container inversion:hover,
  .form-container:focus-within {
    background: rgba(255, 255, 255, 0.2);
    box-shadow: none;
  }

  .form-container h2 {
    margin-top: 0;
    margin-bottom: 2rem;
    font-weight: 700;
    color: #ff6f91;
    font-size: 2rem;
    text-align: center;
  }

  .form-group {
    margin-bottom: 1.5rem;
    position: relative;
  }

  label {
    margin-bottom: 0.3rem;
    font-weight: 600;
    color: #444;
    font-size: 0.95rem;
    display: block;
  }

  .error-message {
    color: #e02424;
    font-size: 0.85rem;
    margin-top: 0.3rem;
    position: absolute;
    bottom: -18px;
    left: 0;
    font-weight: 600;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
  }
  
  .checkbox-group input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    margin-bottom: 0; /* Reset global form layout margin */
  }
  
  .checkbox-group label {
    margin: 0;
    cursor: pointer;
  }

  fieldset {
    border: 2px solid var(--primary-pink);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    background: rgba(255, 255, 255, 0.1);
  }

  legend {
    font-weight: bold;
    color: var(--primary-pink-dark);
    padding: 0 0.5rem;
  }

  #employee-password-group {
    transition: max-height 0.4s ease, opacity 0.4s ease;
    overflow: hidden;
  }

  @media (max-width: 520px) {
    .form-container {
      padding: 2rem 1.5rem;
    }
  }
</style>
{% endblock %}

{% block content %}
  <div class="form-container">
    <h2>Create Your Account</h2>
    <form id="registration-form" method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
        <span id="username-error" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
        <span id="email-error" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
        <span id="password-error" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required />
        <span id="confirm-password-error" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="role">Register as</label>
        <select id="role" name="role" required>
          <option value="customer" selected>Customer</option>
          <option value="employee">Employee</option>
        </select>
      </div>

      <div class="form-group" id="employee-password-group" style="max-height: 0; opacity: 0;">
        <label for="employee_password">Employee Password</label>
        <input type="password" id="employee_password" name="employee_password" readonly />
        <span id="employee-password-error" class="error-message"></span>
      </div>

      <fieldset>
        <legend>Primary Address</legend>
        <div class="form-group">
          <label for="street_address">Street Address</label>
          <input type="text" id="street_address" name="street_address" required />
          <span id="street-address-error" class="error-message"></span>
        </div>
        <div class="address-row" style="display:flex; gap:1rem; flex-wrap: wrap;">
          <div class="form-group" style="flex:1 1 45%;">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required />
            <span id="city-error" class="error-message"></span>
          </div>
          <div class="form-group" style="flex:1 1 45%;">
            <label for="state">State / Province</label>
            <input type="text" id="state" name="state" required />
            <span id="state-error" class="error-message"></span>
          </div>
        </div>
        <div class="form-group" style="max-width: 150px;">
          <label for="zipcode">Zip / Postal Code</label>
          <input type="text" id="zipcode" name="zipcode" required />
          <span id="zipcode-error" class="error-message"></span>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="billing_same">Is your billing address the same as your primary address?</label>
        <select id="billing_same" name="billing_same" required>
          <option value="" disabled selected>Select an option</option>
          <option value="yes">Yes, use primary address</option>
          <option value="no">No, I will enter a different billing address</option>
        </select>
        <span id="billing-same-error" class="error-message"></span>
      </div>

      <fieldset id="billing-address-group" style="display: none;">
        <legend>Billing Address</legend>
        <div class="form-group">
          <label for="billing_street_address">Street Address</label>
          <input type="text" id="billing_street_address" name="billing_street_address" />
          <span id="billing-street-address-error" class="error-message"></span>
        </div>
        <div class="address-row" style="display:flex; gap:1rem; flex-wrap: wrap;">
          <div class="form-group" style="flex:1 1 45%;">
            <label for="billing_city">City</label>
            <input type="text" id="billing_city" name="billing_city" />
            <span id="billing-city-error" class="error-message"></span>
          </div>
          <div class="form-group" style="flex:1 1 45%;">
            <label for="billing_state">State / Province</label>
            <input type="text" id="billing_state" name="billing_state" />
            <span id="billing-state-error" class="error-message"></span>
          </div>
        </div>
        <div class="form-group" style="max-width: 150px;">
          <label for="billing_zipcode">Zip / Postal Code</label>
          <input type="text" id="billing_zipcode" name="billing_zipcode" />
          <span id="billing-zipcode-error" class="error-message"></span>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="save_payment">Save Payment Method?</label>
        <select id="save_payment" name="save_payment" required>
          <option value="" disabled selected>Select an option</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
        <span id="save-payment-error" class="error-message"></span>
      </div>

      <fieldset id="payment-details-container" style="display: none;">
        <legend>Payment Details</legend>
        <div class="form-group">
          <label for="card_name">Name on Card</label>
          <input type="text" id="card_name" name="card_name" />
          <span id="card-name-error" class="error-message"></span>
        </div>
        <div class="form-group">
          <label for="card_number">Card Number</label>
          <input
            type="text"
            id="card_number"
            name="card_number"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
          />
          <span id="card-number-error" class="error-message"></span>
        </div>
        <div class="address-row" style="display:flex; gap:1rem;">
          <div style="flex:1;">
            <label for="card_expiry">Expiration Date (MM/YY)</label>
            <input type="text" id="card_expiry" name="card_expiry" maxlength="5" placeholder="MM/YY" />
            <span id="card-expiry-error" class="error-message"></span>
          </div>
          <div style="flex:1;">
            <label for="card_cvv">CVV</label>
            <input type="text" id="card_cvv" name="card_cvv" maxlength="4" placeholder="123" />
            <span id="card-cvv-error" class="error-message"></span>
          </div>
        </div>
      </fieldset>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the <a href="#" target="_blank">terms and conditions</a>
        </label>
        <span id="terms-error" class="error-message"></span>
      </div>

      <button type="submit" class="btn" style="width: 100%;">Register</button>
    </form>
  </div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const roleSelect = document.getElementById('role');
    const empPassGroup = document.getElementById('employee-password-group');
    const empPassInput = document.getElementById('employee_password');
    const billingSame = document.getElementById('billing_same');
    const billingGroup = document.getElementById('billing-address-group');
    const savePayment = document.getElementById('save_payment');
    const paymentDetails = document.getElementById('payment-details-container');

    function toggleEmployeePassword() {
      if (roleSelect.value === 'employee') {
        empPassGroup.style.maxHeight = '100px';
        empPassGroup.style.opacity = '1';
        empPassInput.required = true;
        empPassInput.value = '123enr';
        empPassInput.readOnly = true;
      } else {
        empPassGroup.style.maxHeight = '0';
        empPassGroup.style.opacity = '0';
        empPassInput.required = false;
        empPassInput.value = '';
        empPassInput.readOnly = false;
      }
    }

    function toggleBillingAddress() {
      if (billingSame.value === 'no') {
        billingGroup.style.display = 'block';
        billingGroup.querySelectorAll('input').forEach(input => input.required = true);
      } else {
        billingGroup.style.display = 'none';
        billingGroup.querySelectorAll('input').forEach(input => {
          input.required = false;
          input.value = '';
        });
      }
    }

    function togglePaymentDetails() {
      if (savePayment.value === 'yes') {
        paymentDetails.style.display = 'block';
        paymentDetails.querySelectorAll('input').forEach(input => input.required = true);
      } else {
        paymentDetails.style.display = 'none';
        paymentDetails.querySelectorAll('input').forEach(input => {
          input.required = false;
          input.value = '';
        });
      }
    }

    roleSelect.addEventListener('change', toggleEmployeePassword);
    billingSame.addEventListener('change', toggleBillingAddress);
    savePayment.addEventListener('change', togglePaymentDetails);

    // Initialize state
    toggleEmployeePassword();
    toggleBillingAddress();
    togglePaymentDetails();
  });
</script>
{% endblock %}
